name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          install_args: shellcheck
      - name: Lint the scripts
        run: make lint

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        run: make cowsay-native
      - name: Test
        run: make check-native

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
      - name: Build
        run: make cowsay.wasm
      - name: Size against the README
        run: make check-size
      - name: Test
        run: make check-wasm
      - uses: actions/upload-artifact@v7
        with:
          name: cowsay.wasm
          path: cowsay.wasm
