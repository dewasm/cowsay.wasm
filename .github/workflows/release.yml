name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against the version the binary reports
        run: |
          version=$(sed -n 's/^#define COWSAY_WASM_VERSION "\(.*\)"/\1/p' cowsay.c)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match COWSAY_WASM_VERSION $version" >&2
            exit 1
          fi
      - name: Install build tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          install_args: wasi-sdk binaryen
      - name: Build
        run: make cowsay.wasm
      # A release made on GitHub first pushes its tag too, so it may already exist here.
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber cowsay.wasm
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes cowsay.wasm
          fi
