name: Release

# The tag's commit is tested by CI on main; this workflow only builds and publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasi-sdk
        run: |
          curl -fsSL --retry 5 -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  /tmp/wasi-sdk.tar.gz" | shasum -a 256 -c -
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt
          echo "WASI_SDK_PATH=/opt/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build
        run: make cowsay.wasm
      # No checksum file: GitHub reports each asset's sha256 in the releases API digest field.
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes cowsay.wasm
