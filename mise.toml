# The build and test tools, at the versions CI runs: `mise install` gives a shell the same ones.
# Each one is fetched from its GitHub release and checked against the SHA-256 recorded here,
# so moving to a new version is the version line plus its hashes. The host provides cc and perl.
# wasmtime publishes no checksum file; the hashes below were computed from the release assets.

[tools."http:wasi-sdk"]
version = "34"

[tools."http:wasi-sdk".platforms.linux-x64]
url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-{{version}}/wasi-sdk-{{version}}.0-x86_64-linux.tar.gz"
checksum = "sha256:b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4"

[tools."http:wasi-sdk".platforms.linux-arm64]
